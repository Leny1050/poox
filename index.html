<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С 8 Марта, Мама!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb, #e6a8d3);
            animation: bgAnimation 8s infinite alternate ease-in-out;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: 'Great Vibes', cursive;
            color: #fff;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        @keyframes bgAnimation {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        h1 {
            font-size: 5em;
            text-shadow: 4px 4px 20px rgba(255, 255, 255, 0.9);
            background: linear-gradient(90deg, #ffffff, #f8b0d8, #a1c4fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s infinite alternate;
        }

        p {
            font-size: 2.5em;
            max-width: 800px;
            text-shadow: 2px 2px 15px rgba(255, 255, 255, 0.8);
            animation: fadeIn 3s ease-in-out;
        }

        @keyframes glow {
            0% { text-shadow: 5px 5px 25px rgba(255, 255, 255, 1); }
            100% { text-shadow: 7px 7px 35px rgba(255, 255, 255, 1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .petal {
            position: absolute;
            background: rgba(255, 182, 193, 0.9);
            border-radius: 50%;
            opacity: 0.9;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffeb3b;
            border-radius: 50%;
            opacity: 0.9;
            animation: twinkle 3s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1.5); }
        }

        .wave {
            position: absolute;
            width: 100%;
            height: 20vh;
            bottom: 0;
            left: 0;
            background: rgba(255, 255, 255, 0.3);
            animation: wave 6s infinite alternate ease-in-out;
            border-radius: 50% 50% 0 0;
        }

        @keyframes wave {
            0% { transform: translateY(10px); }
            100% { transform: translateY(-10px); }
        }

        /* Адаптивность для мобильных устройств */
        @media (max-width: 768px) {
            h1 {
                font-size: 3em;
            }

            p {
                font-size: 1.8em;
                padding: 0 20px;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 2.5em;
            }

            p {
                font-size: 1.5em;
                padding: 0 15px;
            }
        }
    </style>
</head>
<body>
    <h1>С 8 Марта, Мама!</h1>
    <p>Ты — лучшая мама! Пусть этот день принесёт тебе счастье и улыбки! 💖</p>

    <div class="wave"></div>

    <script>
        function createPetal() {
            const petal = document.createElement("div");
            petal.classList.add("petal");
            document.body.appendChild(petal);

            const startLeft = Math.random() * window.innerWidth;
            const duration = Math.random() * 6 + 4;
            const size = Math.random() * 20 + 5;
            const hue = Math.random() * 30 + 330;

            petal.style.left = `${startLeft}px`;
            petal.style.animationDuration = `${duration}s`;
            petal.style.width = `${size}px`;
            petal.style.height = `${size}px`;
            petal.style.background = `hsl(${hue}, 100%, 85%)`;

            setTimeout(() => {
                petal.remove();
            }, duration * 1000);
        }

        function createSparkle() {
            const sparkle = document.createElement("div");
            sparkle.classList.add("sparkle");
            document.body.appendChild(sparkle);

            const startLeft = Math.random() * window.innerWidth;
            const startTop = Math.random() * window.innerHeight;
            const duration = Math.random() * 3 + 2;

            sparkle.style.left = `${startLeft}px`;
            sparkle.style.top = `${startTop}px`;
            sparkle.style.animationDuration = `${duration}s`;

            setTimeout(() => {
                sparkle.remove();
            }, duration * 1000);
        }

        setInterval(createPetal, 150);
        setInterval(createSparkle, 300);
    </script>
</body>
    </html>
